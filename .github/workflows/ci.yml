name: CI

on:
  push:
    branches: ["mykart-v2", "master"]
  pull_request:
    branches: ["master"]

jobs:
  unit-tests:
    name: Build and Unit Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: maven

      - name: Build mkart-common
        run: mvn install -pl mkart-common -am --no-transfer-progress -DskipTests

      - name: Build discovery-server
        run: mvn install -pl discovery-server -am --no-transfer-progress -DskipTests

      - name: Unit tests — all services
        run: |
          mvn test \
            -pl auth-service,api-gateway,notification-service,product-service,order-service,inventory-service,payment-service \
            --no-transfer-progress \
            -Deureka.client.enabled=false \
            -Dspring.cloud.discovery.enabled=false

      - name: Upload unit test reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-test-reports
          path: "**/target/surefire-reports/"
          retention-days: 7

  integration-tests:
    name: Integration Tests (Testcontainers)
    runs-on: ubuntu-latest
    needs: unit-tests

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: maven

      - name: Build mkart-common
        run: mvn install -pl mkart-common -am --no-transfer-progress -DskipTests

      - name: Run integration tests (order, inventory, payment)
        run: |
          mvn verify \
            -pl order-service,inventory-service,payment-service \
            -P integration-test \
            --no-transfer-progress

      - name: Upload integration test reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-test-reports
          path: "**/target/failsafe-reports/"
          retention-days: 7

  contract-tests:
    name: Spring Cloud Contract Verification
    runs-on: ubuntu-latest
    needs: unit-tests

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: maven

      - name: Build mkart-common
        run: mvn install -pl mkart-common -am --no-transfer-progress -DskipTests

      - name: Verify contracts (inventory, order)
        run: |
          mvn verify \
            -pl inventory-service,order-service \
            -P contract-verify \
            --no-transfer-progress

  full-build:
    name: Full Build
    runs-on: ubuntu-latest
    needs: [integration-tests, contract-tests]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: maven

      - name: Build all modules
        run: mvn clean install --no-transfer-progress -DskipTests
