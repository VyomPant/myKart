name: CI

on:
  push:
    branches: ["mykart-v2", "master"]
  pull_request:
    branches: ["master"]

jobs:
  build-and-test:
    name: Build and Unit Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: maven

      - name: Build mkart-common
        run: mvn install -pl mkart-common -am --no-transfer-progress

      - name: Build discovery-server
        run: mvn install -pl discovery-server -am --no-transfer-progress

      - name: Unit tests — auth-service
        run: mvn test -pl auth-service --no-transfer-progress

      - name: Unit tests — api-gateway
        run: mvn test -pl api-gateway --no-transfer-progress

      - name: Unit tests — notification-service
        run: mvn test -pl notification-service --no-transfer-progress

      - name: Compile stub modules
        run: mvn compile -pl product-service,order-service,inventory-service,payment-service --no-transfer-progress

  # Phase 5: integration and contract tests will be added here
